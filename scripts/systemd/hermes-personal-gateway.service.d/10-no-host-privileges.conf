# Defense in depth for the existing personal gateway, NOT tenant isolation.
# Keep ExecStart, identity, environment, routing and lifecycle in the main unit.
# Install as a root-owned drop-in; daemon-reload and restart the existing unit
# only after the security regression suite passes. Do not start a second gateway.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
